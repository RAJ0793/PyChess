
name: Deploy PyChess Documentation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Prepare website files
      - name: Prepare website files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "D:\Projects\PyChess\assets\deploy"
          $site = Join-Path $env:GITHUB_WORKSPACE "_site"

          if (!(Test-Path "$source\index.html")) {
              throw "index.html not found: $source"
          }

          if (Test-Path $site) {
              Remove-Item $site -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $site |
              Out-Null

          Copy-Item "$source\*" $site -Recurse -Force

          Write-Host "Website files:"
          Get-ChildItem $site -Recurse -File

          if (!(Test-Path "$site\index.html")) {
              throw "Deployment index.html missing"
          }

      # 3. Configure Git Bash
      - name: Configure Git Bash
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $GitBin = "C:\Program Files\Git\bin"
          $GitUsrBin = "C:\Program Files\Git\usr\bin"

          if (!(Test-Path "$GitBin\bash.exe")) {
              throw "Git Bash not found: $GitBin\bash.exe"
          }

          if (!(Test-Path "$GitUsrBin\tar.exe")) {
              throw "Git TAR not found: $GitUsrBin\tar.exe"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $GitUsrBin
          Add-Content -Path $env:GITHUB_PATH -Value $GitBin

      # 4. Verify archive tools
      - name: Verify Git Bash and TAR
        shell: pwsh
        run: |
          $bash = (Get-Command bash.exe -ErrorAction Stop).Source
          $tar = (Get-Command tar.exe -ErrorAction Stop).Source

          Write-Host "Bash: $bash"
          Write-Host "TAR:  $tar"

          if ($bash -notlike "C:\Program Files\Git\*") {
              throw "Wrong Bash detected. WSL launcher must not be used."
          }

          if ($tar -notlike "C:\Program Files\Git\*") {
              throw "Wrong TAR detected."
          }

          Write-Host "Git archive tools verified successfully."

      # 5. Upload Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # 6. Deploy website
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
