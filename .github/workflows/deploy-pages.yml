
name: Deploy PyChess Documentation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "D:\Projects\PyChess\assets\deploy"
          $site = Join-Path $env:GITHUB_WORKSPACE "_site"

          if (!(Test-Path "$source\index.html")) {
              throw "index.html not found"
          }

          New-Item -ItemType Directory -Force -Path $site |
              Out-Null

          Copy-Item "$source\*" $site -Recurse -Force

          Get-ChildItem $site -Recurse -File

      - name: Upload website files
        uses: actions/upload-artifact@v4
        with:
          name: pychess-site
          path: _site/
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download website files
        uses: actions/download-artifact@v4
        with:
          name: pychess-site
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
