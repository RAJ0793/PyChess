
name: Deploy PyChess Website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Prepare Website (Windows)
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Website Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Source = "D:\Projects\PyChess\assets\deploy"
          $Site = Join-Path $env:GITHUB_WORKSPACE "_site"

          if (!(Test-Path "$Source\index.html")) {
              throw "Website index.html not found: $Source"
          }

          if (Test-Path $Site) {
              Remove-Item $Site -Recurse -Force
          }

          New-Item -ItemType Directory -Path $Site -Force |
              Out-Null

          Copy-Item "$Source\*" $Site -Recurse -Force

          if (!(Test-Path "$Site\index.html")) {
              throw "Deployment index.html missing"
          }

          Write-Host "Website prepared successfully."
          Get-ChildItem $Site -Recurse -File

      - name: Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pychess-site
          path: _site/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy Website (GitHub Cloud)
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-slim

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Website Artifact
        uses: actions/download-artifact@v4
        with:
          name: pychess-site
          path: _site

      - name: Verify Website Files
        run: |
          test -f _site/index.html
          echo "Website files verified:"
          find _site -type f

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
