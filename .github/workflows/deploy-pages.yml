name: Deploy PyChess Documentation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy local documentation
        shell: pwsh
        run: |
          $source = "D:\Projects\PyChess\assets\deploy"
          $site = Join-Path $env:GITHUB_WORKSPACE "_site"
          if (!(Test-Path "$source\index.html")) { throw "index.html not found" }
          New-Item -ItemType Directory -Force -Path $site | Out-Null
          Copy-Item -Path "$source\*" -Destination $site -Recurse -Force
          Get-ChildItem $site -Recurse -File

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
